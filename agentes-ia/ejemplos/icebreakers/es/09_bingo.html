    box.hidden = false; clear(box);
    box.append(el("h2", null, T.scoreboard));
    this.list.forEach((t, i) => box.append(el("div", { class: "team", style: "--team:" + t.color },
      el("span", { class: "tname" }, t.name), el("b", { class: "tscore" }, t.score),
      el("span", { class: "adj" }, el("button", { class: "mini", title: "-10", onclick: () => this.add(i, -10) }, "−"),
        el("button", { class: "mini", title: "+10", onclick: () => this.add(i, 10) }, "+")))));
  },
  add(i, pts) {
    this.list[i].score += pts; this.render();
    const node = document.querySelectorAll("#score .team")[i];
    if (node) { node.classList.add("bump"); setTimeout(() => node.classList.remove("bump"), 450); }
  },
};

function awardBar(points, onDone) {
  const next = el("button", { class: "btn primary big", onclick: () => { chosen.forEach(i => Teams.add(i, points)); if (chosen.size) Sound.pop(); onDone(); } }, T.next + " ▶");
  const chosen = new Set();
  if (!Teams.list.length) return el("div", { class: "row" }, next);
  const chips = el("div", { class: "chips" });
  Teams.list.forEach((t, i) => {
    const b = el("button", { class: "chip", style: "--team:" + t.color, onclick: () => { if (chosen.has(i)) chosen.delete(i); else chosen.add(i); b.classList.toggle("on"); } }, t.name);
    chips.append(b);
  });
  return el("div", { class: "award" }, el("p", { class: "award-q" }, fmt(T.who_scored, { points })), chips, next);
}

function Timer(seconds, onEnd) {
  const fill = el("div", { class: "timer-fill" }), num = el("span", { class: "timer-num" }, seconds);
  const node = el("div", { class: "timer" }, fill, num);
  let left = seconds, id = null;
  const stop = () => { if (id) { clearInterval(id); id = null; } };
  if (seconds > 0) {
    id = setInterval(() => {
      left -= 1; num.textContent = Math.max(0, left); fill.style.width = (100 * Math.max(0, left) / seconds) + "%";
      if (left <= 5 && left > 0) Sound.tick();
      if (left <= 0) { stop(); node.classList.add("done"); num.textContent = T.time_up; Sound.bad(); if (onEnd) onEnd(); }
    }, 1000);
  } else node.hidden = true;
  return { node, stop };
}

let current = null;
function screen(...kids) {
  if (current && current.cleanup) current.cleanup();
  clear(stage);
  current = el("section", { class: "screen" }, ...kids);
  stage.append(current);
  return current;
}

function modal(content, persistent) {
  const box = el("div", { class: "modal" }), overlay = el("div", { class: "overlay" }, box);
  const close = () => overlay.remove();
  box.append(el("button", { class: "mini x", title: T.close, onclick: close }, "✕"), content);
  if (!persistent) overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
  document.body.append(overlay);
  return { close, box };
}

function showRules() {
  modal(el("div", null, el("h2", null, "📖 " + T.how_to_play), el("ul", null, G.rules.map(r => el("li", null, r)))));
}

function intro(count, start, extra) {
  screen(el("div", { class: "intro card" }, el("div", { class: "big-emoji" }, G.emoji), el("h2", null, G.title),
    G.subtitle ? el("p", { class: "muted" }, G.subtitle) : null,
    count !== null ? el("p", null, el("span", { class: "pill" }, fmt(T.count_items, { n: count }))) : null,
    extra || null,
    el("div", { class: "row" }, start ? el("button", { class: "btn primary big", onclick: start }, T.start + " ▶") : null,
      el("button", { class: "btn", onclick: showRules }, "📖 " + T.how_to_play))));
}

function podium() {
  Sound.win(); confetti();
  const sorted = Teams.list.slice().sort((a, b) => b.score - a.score);
  screen(el("div", { class: "card podium" }, el("h2", null, sorted.length ? "🏆 " + T.final : "🎉 " + T.thanks),
    sorted.length ? el("ol", { class: "ranking" }, sorted.map((t, i) => el("li", { style: "--team:" + t.color + ";animation-delay:" + (i * 0.12) + "s" },
      el("span", { class: "medal" }, ["🥇", "🥈", "🥉"][i] || (i + 1) + "."), el("span", null, t.name), el("b", null, t.score)))) : el("div", { class: "big-emoji" }, "🎊"),
    el("button", { class: "btn", onclick: () => location.reload() }, "↺ " + T.play_again)));
}

function setupChrome() {
  document.title = G.title;
  if (G.dark) document.body.classList.add("dark");
  const soundBtn = document.getElementById("btn-sound");
  const paintSound = () => { soundBtn.textContent = Sound.on ? "🔊" : "🔇"; soundBtn.title = T.sound; };
  soundBtn.addEventListener("click", () => { Sound.on = !Sound.on; paintSound(); });
  paintSound();
  const full = document.getElementById("btn-full");
  full.title = T.fullscreen;
  full.addEventListener("click", () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); });
  const rules = document.getElementById("btn-rules");
  rules.title = T.rules; rules.addEventListener("click", showRules);
  document.getElementById("offline").textContent = "✔ " + T.offline + " · IcePilot";
  Teams.render();
}


function runBingo() {
  const terms = G.data.terms, cards = G.data.cards, size = G.data.size;
  const label = idx => idx < 0 ? "⭐ " + T.free : terms[idx];
  const status = (card, marked) => {
    const lines = [];
    for (let r = 0; r < size; r++) lines.push([...Array(size).keys()].map(c => r * size + c));
    for (let c = 0; c < size; c++) lines.push([...Array(size).keys()].map(r => r * size + c));
    lines.push([...Array(size).keys()].map(k => k * size + k)); lines.push([...Array(size).keys()].map(k => k * size + size - 1 - k));
    const ok = k => card[k] < 0 || marked.has(card[k]);
    return { lines: lines.filter(l => l.every(ok)).length, full: card.every((_, k) => ok(k)) };
  };
  const winText = st => (G.options.win === "full" ? st.full : st.lines > 0) ? (st.full ? T.bingo : T.line) : "";
  const header = () => size === 5 ? el("div", { class: "bhead", style: "--size:5" }, [..."BINGO"].map(ch => el("span", null, ch))) : null;
  const input = el("input", { type: "number", min: 1, max: cards.length, value: 1 });
  screen(el("div", { class: "intro card" }, el("div", { class: "big-emoji" }, G.emoji), el("h2", null, G.title), G.subtitle ? el("p", { class: "muted" }, G.subtitle) : null,
    el("p", null, el("b", null, T.bingo_mode)),
    el("div", { class: "modes" },
      el("div", { class: "card mode" }, el("div", { class: "big-emoji" }, "🎙"), el("b", null, T.moderator), el("span", { class: "muted" }, T.moderator_desc), el("button", { class: "btn primary", onclick: caller }, T.start + " ▶")),
      el("div", { class: "card mode" }, el("div", { class: "big-emoji" }, "🎟"), el("b", null, T.player), el("span", { class: "muted" }, T.player_desc), el("label", null, T.card_number + " ", input),
        el("button", { class: "btn primary", onclick: () => player(parseInt(input.value, 10)) }, T.open_card))),
    el("div", { class: "row" }, el("button", { class: "btn", onclick: showRules }, "📖 " + T.how_to_play))));

  function player(n) {
    if (!(n >= 1 && n <= cards.length)) { alert(T.invalid_card); return; }
    const card = cards[n - 1], marked = new Set(), banner = el("div", { class: "banner" });
    const grid = el("div", { class: "bcard", style: "--size:" + size }, card.map(idx => {
      const b = el("button", { class: "bcell" + (idx < 0 ? " free" : "") }, label(idx));
      if (idx >= 0) b.addEventListener("click", () => {
        if (marked.has(idx)) marked.delete(idx); else marked.add(idx);
        b.classList.toggle("on"); Sound.pop();
        const text = winText(status(card, marked));
        if (text && banner.textContent !== text) { Sound.win(); confetti(); }
        banner.textContent = text;
      });
      return b;
    }));
    screen(el("span", { class: "pill" }, fmt(T.card_of, { n, total: cards.length })), header(), grid, banner);
  }
  function caller() {
    const order = shuffle([...terms.keys()]), called = [];
    const current = el("div", { class: "current" }, "🎱"), counter = el("span", { class: "pill" }), list = el("div", { class: "called" });
    const drawBtn = el("button", { class: "btn primary big", onclick: drawNext }, "🎱 " + T.draw);
    const check = el("input", { type: "number", min: 1, max: cards.length, placeholder: "#" });
    const paint = () => { counter.textContent = called.length + " / " + terms.length; clear(list); called.slice().reverse().forEach(i => list.append(el("span", null, terms[i]))); };
    screen(counter, current, el("div", { class: "row" }, drawBtn, el("span", null, T.card_number + " "), check, el("button", { class: "btn", onclick: verify }, "🔍 " + T.check_card)),
      el("b", null, T.called), list);
    paint();
    function drawNext() {
      if (!order.length) { current.textContent = T.drawn_all; return; }
      drawBtn.disabled = true; let k = 0;
      const id = setInterval(() => {
        current.textContent = terms[Math.floor(Math.random() * terms.length)]; Sound.tick();
        if (++k > 12) { clearInterval(id); const idx = order.pop(); called.push(idx); current.textContent = terms[idx]; Sound.ok(); drawBtn.disabled = false; paint(); }
      }, 70);
    }
    function verify() {
      const n = parseInt(check.value, 10);
      if (!(n >= 1 && n <= cards.length)) { alert(T.invalid_card); return; }
      const card = cards[n - 1], marked = new Set(called), st = status(card, marked), text = winText(st);
      modal(el("div", { class: "after" }, el("span", { class: "pill" }, fmt(T.card_of, { n, total: cards.length })), header(),
        el("div", { class: "bcard", style: "--size:" + size }, card.map(idx => el("div", { class: "bcell" + (idx < 0 ? " free" : marked.has(idx) ? " on hit" : "") }, label(idx)))),
        el("div", { class: "banner", style: text ? "" : "color:var(--muted)" }, text || T.no_line)));
      if (text) { Sound.win(); confetti(); }
    }
  }
}

setupChrome();
runBingo();
</script>
</body>
